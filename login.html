<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>판다마켓</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css"
    />
    <link rel="stylesheet" href="css/reset.css" />
    <link
      rel="stylesheet"
      href="css/Mobile/auth.css"
      media="(min-width: 375px) and (max-width: 767px)"
    />
    <link
      rel="stylesheet"
      href="css/Tablet/auth.css"
      media="(min-width: 768px) and (max-width: 1199px)"
    />
    <link
      rel="stylesheet"
      href="css/Desktop/auth.css"
      media="(min-width: 1200px)"
    />
  </head>
  <body>
    <div class="entireBox">
      <a class="imgBox" href="index.html">
        <img class="mainImg" src="img/logo.png" />
      </a>
      <div class="entireItem">
        <div class="itemText">이메일</div>
       <input class="itemInput" id="emailInput" />
        <div class="errorMsg" id="emailError"></div>

        <div class="itemText">비밀번호</div>
        <input class="itemInput" id="passwordInput" type="password" />
         <div class="errorMsg" id="passwordError"></div>
        <div class="signupButton disabled" id="loginButton">
          <div class="signupLink">로그인</div>
        </div>

        <div class="easyLogin">
          <div class="easyLoginText">간편 로그인하기</div>
          <div class="easyLoginIcon">
            <a href="https://www.google.com" class="easyLoginGoogle">
              <img class="easyLoginGoogleImg" src="img/login_google.png" />
            </a>
            <a href="https://www.kakaocorp.com/page" class="easyLoginKakao">
              <img class="easyLoginKakaoImg" src="img/login_kakao.png" />
            </a>
          </div>
        </div>

        <div class="loginPrompt">
          판다마켓이 처음이신가요?
          <a class="loginLink" href="signup.html">회원가입</a>
        </div>
      </div>
    </div>

  </body>
  <script src="js/login.js"></script>
</html>
