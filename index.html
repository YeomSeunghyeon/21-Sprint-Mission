<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>판다마켓</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css"
    />
    <link rel="stylesheet" href="css/reset.css" />
    <link
      rel="stylesheet"
      href="css/Mobile/style.css"
      media="(min-width: 375px) and (max-width: 767px)"
    />
    <link
      rel="stylesheet"
      href="css/Tablet/style.css"
      media="(min-width: 768px) and (max-width: 1199px)"
    />
    <link
      rel="stylesheet"
      href="css/Desktop/style.css"
      media="(min-width: 1200px)"
    />
  </head>
  <body>
    <header>
      <a href="/"><img class="headerImg" src="img/logo.png" /></a>

      <a href="login.html" class="headerLogin">로그인</a>
    </header>
    <div class="homeTop">
      <div class="homeTopText">
        <h1>
          일상의 모든 물건을<br class="br1" />
          거래해 보세요
        </h1>
        <a href="item.html" class="homeTopButton">구경하러가기</a>
      </div>
      <img class="homeTopImage" src="img/home_top.png" />
    </div>
    <div class="hotItem">
      <div class="contentInner">
        <img class="hotItemImg" src="img/home_hotItem.jpg" />
        <div class="hotItemText">
          <span>Hot item</span>
          <h1 class="titleContent">
            인기 상품을<br class="br" />
            확인해 보세요
          </h1>
          <p class="descriptionContent">
            가장 HOT한 중고거래 물품을<br />
            판다 마켓에서 확인해 보세요
          </p>
        </div>
      </div>
    </div>
    <div class="homeSearch">
      <div class="contentInner">
        <div class="homeSearchText">
          <span>Search</span>
          <h1 class="titleContent">
            구매를 원하는<br class="br" />
            상품을 검색하세요
          </h1>
          <p class="descriptionContent">
            구매하고 싶은 물품은 검색해서<br />
            쉽게 찾아보세요
          </p>
        </div>
        <img class="homeSearchImg" src="img/home_search.jpg" />
      </div>
    </div>
    <div class="homeRegister">
      <div class="contentInner">
        <img class="homeRegisterImg" src="img/home_register.jpg" />
        <div class="homeRegisterText">
          <span>Register</span>
          <h1 class="titleContent">
            판매를 원하는<br class="br" />
            상품을 등록하세요
          </h1>
          <p class="descriptionContent">
            어떤 물건이든 판매하고 싶은 상품을<br />
            쉽게 등록하세요
          </p>
        </div>
      </div>
    </div>
    <div class="homeBottom">
      <h1 class="homeBottomText">
        믿을 수 있는<br />
        판다마켓 중고 거래
      </h1>
      <img class="homeBottomImg" src="img/home_bottom.png" />
    </div>
    <footer>
      <div class="footer">
        <span class="footerCopyright">©codeit - 2024</span>
        <div class="footerGroup">
          <ul class="footerNav">
            <li><a href="/">Privacy Policy</a></li>
            <li><a href="/">FAQ</a></li>
          </ul>
          <ul class="footerLink">
            <li>
              <a href="https://www.facebook.com" target="_blank">
                <img src="img/footer_facebook.png" />
              </a>
            </li>
            <li>
              <a href="https://x.com" target="_blank">
                <img src="img/footer_twitter.png" />
              </a>
            </li>
            <li>
              <a href="https://www.youtube.com" target="_blank">
                <img src="img/footer_youtube.png" />
              </a>
            </li>
            <li>
              <a href="https://www.instagram.com" target="_blank">
                <img src="img/footer_instagram.png" />
              </a>
            </li>
          </ul>
        </div>
      </div>
    </footer>

</html>
